# group22-02 (Ubuntu Server): static IP 222.22.22.10
# Used by server/static-ip.sh -> /etc/netplan/50-cloud-init.yaml
network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: no
      addresses:
        - 222.22.22.10/24
      routes:
        - to: default
          via: 222.22.22.1
      nameservers:
        addresses: [8.8.8.8, 8.8.4.4]
