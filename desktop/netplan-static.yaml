# group22-01 (Ubuntu Desktop): static IP 222.22.22.11
# Used by desktop/static-ip.sh -> /etc/netplan/01-network-manager-all.yaml
network:
  version: 2
  renderer: NetworkManager
  ethernets:
    enp0s3:
      dhcp4: no
      addresses:
        - 222.22.22.11/24
      routes:
        - to: default
          via: 222.22.22.1
      nameservers:
        addresses: [8.8.8.8, 8.8.4.4]
